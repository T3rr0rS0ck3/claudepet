name: Release

on:
  push:
    tags: ['v*']
  # Manual (re)run for an existing tag: Actions → Release → Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = '${{ env.TAG }}'.TrimStart('v')
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "Tag '${{ env.TAG }}' is not like v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$($Matches[1]).$($Matches[2]).$($Matches[3]).0" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build (self-contained)
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }} -SelfContained

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Claudius/* -DestinationPath dist/Claudius-${{ steps.version.outputs.version }}-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DNumericVersion=${{ steps.version.outputs.numeric }} installer/Claudius.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Versions from before the rename to Claudius look for the setup under its old name.
      - name: Setup for older versions
        shell: pwsh
        run: Copy-Item dist/Claudius-Setup-${{ steps.version.outputs.version }}.exe dist/ClaudePet-Setup-${{ steps.version.outputs.version }}.exe

      # The in-app updater checks the downloaded setup against this file.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Claudius-Setup-*.exe, dist/ClaudePet-Setup-*.exe, dist/Claudius-*-portable.zip |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      # Unsigned MSIX for the Microsoft Store (the Store signs it). Attached to the run and to the release;
      # it can't be installed as is, only uploaded in Partner Center.
      - name: Store package
        if: steps.version.outputs.prerelease == 'false'
        shell: pwsh
        run: ./packaging/build-msix.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload Store package
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/upload-artifact@v7
        with:
          # Unzipped: the download is the .msix itself, ready for Partner Center.
          path: dist/Claudius-${{ steps.version.outputs.version }}.msix
          archive: false
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Claudius - KI Usage Pet ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            **Installation:** `Claudius-Setup-${{ steps.version.outputs.version }}.exe` herunterladen und ausführen (keine Admin-Rechte, kein .NET nötig).
            Im Setup kann Claudius direkt als statusLine im KI-Assistenten eingetragen werden.

            Alternativ: `Claudius-${{ steps.version.outputs.version }}-portable.zip` entpacken und `Claudius.exe` starten.

            `Claudius-${{ steps.version.outputs.version }}.msix` ist das unsignierte Paket für den Microsoft Store und lässt sich so nicht installieren.
          files: |
            dist/Claudius-Setup-${{ steps.version.outputs.version }}.exe
            dist/ClaudePet-Setup-${{ steps.version.outputs.version }}.exe
            dist/Claudius-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
            dist/Claudius-${{ steps.version.outputs.version }}.msix

